name: CAMPUSOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build:
    name: Java compile and verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and run available Maven checks
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend-build:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Test frontend security helpers
        run: npm test
      - name: Build frontend
        run: npm run build

  container-build:
    name: Build Java API container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build --tag campusos-api:ci .
      - name: Verify container fails closed without auth secret
        shell: bash
        run: |
          set +e
          output="$(docker run --rm campusos-api:ci 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Container started without CAMPUSOS_AUTH_SECRET"
            exit 1
          fi
          if ! grep -q "CAMPUSOS_AUTH_SECRET must be configured" <<<"$output"; then
            echo "$output"
            echo "::error::Container failed for an unexpected reason"
            exit 1
          fi
          echo "Container correctly fails closed without CAMPUSOS_AUTH_SECRET."



  container-runtime-smoke:
    name: Production container runtime and database readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campusos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campusos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Initialize disposable PostgreSQL schema and least-privilege app role
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated;"
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 --file=resources/supabase_schema.sql
          sed 's/REPLACE_WITH_A_LONG_RANDOM_PASSWORD/CiOnly-Runtime-Smoke-Password-2026-NotASecret/g' resources/supabase_app_role.sql.example \
            | psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1
      - name: Build production API image
        run: docker build --tag campusos-api:runtime-ci .
      - name: Start container and verify live readiness and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name campusos-api-runtime-ci --network host \
            --env CAMPUSOS_ENV=production \
            --env PORT=18080 \
            --env CAMPUSOS_AUTH_SECRET=campusos-ci-runtime-secret-at-least-32-characters \
            --env CAMPUSOS_DB_URL='jdbc:postgresql://127.0.0.1:5432/campusos?sslmode=disable' \
            --env CAMPUSOS_DB_USERNAME=campusos_app \
            --env CAMPUSOS_DB_PASSWORD=CiOnly-Runtime-Smoke-Password-2026-NotASecret \
            --env CAMPUSOS_DB_POOL_SIZE=5 \
            --env CAMPUSOS_CORS_ORIGINS=https://campusos.example.test \
            campusos-api:runtime-ci
          cleanup() {
            docker logs campusos-api-runtime-ci 2>/dev/null || true
            docker rm -f campusos-api-runtime-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /tmp/campusos-ready.json --write-out '%{http_code}' http://127.0.0.1:18080/api/health/ready || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/campusos-ready.json 2>/dev/null || true
            echo "::error::Production container did not become database-ready within 60 seconds."
            exit 1
          fi
          grep -q '"status":"ready"' /tmp/campusos-ready.json
          grep -q '"database":"connected"' /tmp/campusos-ready.json

      - name: Stress production container with 1,000 concurrent database-readiness requests
        env:
          CAMPUSOS_LOAD_TEST_URL: http://127.0.0.1:18080
        run: node load/container-readiness-smoke.mjs

      - name: Verify authentication boundary and invalid-login handling
        shell: bash
        run: |
          set -euo pipefail
          auth_status="$(curl --silent --show-error --output /tmp/campusos-auth.json --write-out '%{http_code}' \
            http://127.0.0.1:18080/api/tickets/reporter/1)"
          if [ "$auth_status" != "401" ]; then
            cat /tmp/campusos-auth.json
            echo "::error::Unauthenticated protected route returned HTTP $auth_status instead of 401."
            exit 1
          fi

          login_status="$(curl --silent --show-error --output /tmp/campusos-login.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"runtime-smoke@example.test","password":"InvalidPassword!2026"}' \
            http://127.0.0.1:18080/api/auth/login)"
          if [ "$login_status" != "401" ]; then
            cat /tmp/campusos-login.json
            echo "::error::Invalid login did not return HTTP 401; database-backed auth may not be working."
            exit 1
          fi
          echo "Production image started with a least-privilege DB role; readiness, shared login-limit DB access, and protected-route auth checks passed."

  mysql-integration:
    name: MySQL booking integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campusos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      CAMPUSOS_DB_URL: jdbc:mysql://localhost:3306/campusos?sslMode=DISABLED
      CAMPUSOS_DB_USERNAME: root
      CAMPUSOS_DB_PASSWORD: root
      CAMPUSOS_DB_POOL_SIZE: "5"
      CAMPUSOS_AUTH_SECRET: campusos-ci-auth-secret-value-at-least-32-characters
      CAMPUSOS_DB_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_TOKEN_REVOCATION_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_LOGIN_ATTEMPT_STORE_TEST_ENABLED: "true"
      CAMPUSOS_MYSQL_IT_ENABLED: "true"
      CAMPUSOS_BROADCAST_SCALE_TEST_ENABLED: "true"
      CAMPUSOS_ADMIN_PAGINATION_TEST_ENABLED: "true"
      CAMPUSOS_STAFF_TICKET_PAGINATION_TEST_ENABLED: "true"
      CAMPUSOS_WRITE_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_LOGIN_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_MIXED_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_BOOKING_HTTP_SCALE_TEST_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Initialize MySQL schema
        run: mysql --host=127.0.0.1 --user=root --password=root < resources/campusos.sql
      - name: Run MySQL booking, broadcast, pagination and mixed-load integration tests
        run: mvn --batch-mode --no-transfer-progress -Dtest=MySqlBookingIntegrationTest,ApiDatabaseLoadTest,TokenRevocationLoadTest,LoginAttemptStoreIntegrationTest,EmergencyBroadcastScaleTest,ApiWriteLoadTest,ApiLoginLoadTest,AdminUserPaginationTest,StaffTicketPaginationTest,MixedWorkloadScaleTest,BookingHttpScaleTest test

  load-smoke:
    name: 1,000-concurrent-request HTTP load smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CAMPUSOS_AUTH_SECRET: campusos-ci-auth-secret-value-at-least-32-characters
      CAMPUSOS_LOAD_TEST_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate staging load-test script syntax
        run: node --check load/staging-k6.mjs
      - name: Run 1,000-concurrent-request HTTP load smoke test
        run: mvn --batch-mode --no-transfer-progress -Dtest=ApiLoadTest test

  postgres-integration:
    name: PostgreSQL workflow integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campusos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campusos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CAMPUSOS_DB_URL: jdbc:postgresql://localhost:5432/campusos?sslmode=disable
      CAMPUSOS_DB_USERNAME: postgres
      CAMPUSOS_DB_PASSWORD: postgres
      CAMPUSOS_DB_POOL_SIZE: "5"
      CAMPUSOS_AUTH_SECRET: campusos-ci-auth-secret-value-at-least-32-characters
      CAMPUSOS_IT_ENABLED: "true"
      CAMPUSOS_DB_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_TOKEN_REVOCATION_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_LOGIN_ATTEMPT_STORE_TEST_ENABLED: "true"
      CAMPUSOS_WRITE_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_LOGIN_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_MIXED_LOAD_TEST_ENABLED: "true"
      CAMPUSOS_BOOKING_HTTP_SCALE_TEST_ENABLED: "true"
      CAMPUSOS_BROADCAST_SCALE_TEST_ENABLED: "true"
      CAMPUSOS_ADMIN_PAGINATION_TEST_ENABLED: "true"
      CAMPUSOS_STAFF_TICKET_PAGINATION_TEST_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify generic managed-PostgreSQL schema and least-privilege role
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 -c "CREATE DATABASE campusos_generic;"
          psql -h localhost -U postgres -d campusos_generic -v ON_ERROR_STOP=1 --file=resources/postgres_schema.sql
          table_count="$(psql -h localhost -U postgres -d campusos_generic -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' AND table_name IN ('users','issues','tickets','ticket_history','resources','bookings','notifications','emergencies','token_revocations','login_attempt_limits')")"
          test "$table_count" = "10"
          sed -e 's/campusos_app/campusos_app_generic/g' -e 's/REPLACE_WITH_A_LONG_RANDOM_PASSWORD/CiOnly-Generic-Postgres-Password-2026-NotASecret/g' -e 's/ON DATABASE campusos TO/ON DATABASE campusos_generic TO/' resources/postgres_app_role.sql.example \
            | psql -h localhost -U postgres -d campusos_generic -v ON_ERROR_STOP=1
          PGPASSWORD='CiOnly-Generic-Postgres-Password-2026-NotASecret' psql -h localhost -U campusos_app_generic -d campusos_generic -v ON_ERROR_STOP=1 -c "SELECT id FROM public.users LIMIT 0"
          if PGPASSWORD='CiOnly-Generic-Postgres-Password-2026-NotASecret' psql -h localhost -U campusos_app_generic -d campusos_generic -v ON_ERROR_STOP=1 -c "DELETE FROM public.users WHERE false"; then
            echo "::error::generic campusos_app unexpectedly has DELETE privilege on users"
            exit 1
          else
            echo "Confirmed generic campusos_app cannot DELETE from users."
          fi
      - name: Prepare Supabase roles and schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated;"
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 --file=resources/supabase_schema.sql
      - name: Configure least-privilege CAMPUSOS app role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 --file=resources/supabase_app_role.sql.example
      - name: Verify app role table privileges
        env:
          PGPASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
        run: |
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "SELECT id FROM public.users LIMIT 0"
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "DELETE FROM public.bookings WHERE false"
          if psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "DELETE FROM public.users WHERE false"; then
            echo "::error::campusos_app unexpectedly has DELETE privilege on public.users"
            exit 1
          else
            echo "Confirmed campusos_app cannot DELETE from public.users."
          fi
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.users SET available = available WHERE false"
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.tickets SET status = status WHERE false"
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.notifications SET is_read = is_read WHERE false"
          if psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.users SET role = role WHERE false"; then
            echo "::error::campusos_app unexpectedly has permission to update user roles"
            exit 1
          else
            echo "Confirmed campusos_app cannot update user roles."
          fi
          if psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.notifications SET user_id = user_id WHERE false"; then
            echo "::error::campusos_app unexpectedly has permission to reassign notifications"
            exit 1
          else
            echo "Confirmed campusos_app cannot reassign notifications."
          fi
      - name: Run PostgreSQL-backed workflow tests
        env:
          CAMPUSOS_DB_USERNAME: campusos_app
          CAMPUSOS_DB_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
          CAMPUSOS_IT_ADMIN_DB_URL: jdbc:postgresql://localhost:5432/campusos?sslmode=disable
          CAMPUSOS_IT_ADMIN_DB_USERNAME: postgres
          CAMPUSOS_IT_ADMIN_DB_PASSWORD: postgres
        run: mvn --batch-mode --no-transfer-progress clean verify
