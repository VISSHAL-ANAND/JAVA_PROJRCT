name: CAMPUSOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build:
    name: Java compile and verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and run available Maven checks
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend-build:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Test frontend security helpers
        run: npm test
      - name: Build frontend
        run: npm run build

  container-build:
    name: Build Java API container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build --tag campusos-api:ci .
      - name: Verify container fails closed without auth secret
        shell: bash
        run: |
          set +e
          output="$(docker run --rm campusos-api:ci 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Container started without CAMPUSOS_AUTH_SECRET"
            exit 1
          fi
          if ! grep -q "CAMPUSOS_AUTH_SECRET must be configured" <<<"$output"; then
            echo "$output"
            echo "::error::Container failed for an unexpected reason"
            exit 1
          fi
          echo "Container correctly fails closed without CAMPUSOS_AUTH_SECRET."


  mysql-integration:
    name: MySQL booking integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campusos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      CAMPUSOS_DB_URL: jdbc:mysql://localhost:3306/campusos?sslMode=DISABLED
      CAMPUSOS_DB_USERNAME: root
      CAMPUSOS_DB_PASSWORD: root
      CAMPUSOS_DB_POOL_SIZE: "5"
      CAMPUSOS_AUTH_SECRET: campusos-ci-auth-secret-value-at-least-32-characters
      CAMPUSOS_MYSQL_IT_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Initialize MySQL schema
        run: mysql --host=127.0.0.1 --user=root --password=root < resources/campusos.sql
      - name: Run MySQL-backed booking integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify

  postgres-integration:
    name: PostgreSQL workflow integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campusos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campusos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CAMPUSOS_DB_URL: jdbc:postgresql://localhost:5432/campusos?sslmode=disable
      CAMPUSOS_DB_USERNAME: postgres
      CAMPUSOS_DB_PASSWORD: postgres
      CAMPUSOS_DB_POOL_SIZE: "5"
      CAMPUSOS_AUTH_SECRET: campusos-ci-auth-secret-value-at-least-32-characters
      CAMPUSOS_IT_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Prepare Supabase roles and schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated;"
          psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 --file=resources/supabase_schema.sql
      - name: Configure least-privilege CAMPUSOS app role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campusos -v ON_ERROR_STOP=1 --file=resources/supabase_app_role.sql.example
      - name: Verify app role table privileges
        env:
          PGPASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
        run: |
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "SELECT id FROM public.users LIMIT 0"
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "DELETE FROM public.bookings WHERE false"
          if psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "DELETE FROM public.users WHERE false"; then
            echo "::error::campusos_app unexpectedly has DELETE privilege on public.users"
            exit 1
          else
            echo "Confirmed campusos_app cannot DELETE from public.users."
          fi
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.users SET available = available WHERE false"
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.tickets SET status = status WHERE false"
          psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.notifications SET is_read = is_read WHERE false"
          if psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.users SET role = role WHERE false"; then
            echo "::error::campusos_app unexpectedly has permission to update user roles"
            exit 1
          else
            echo "Confirmed campusos_app cannot update user roles."
          fi
          if psql -h localhost -U campusos_app -d campusos -v ON_ERROR_STOP=1 -c "UPDATE public.notifications SET user_id = user_id WHERE false"; then
            echo "::error::campusos_app unexpectedly has permission to reassign notifications"
            exit 1
          else
            echo "Confirmed campusos_app cannot reassign notifications."
          fi
      - name: Run PostgreSQL-backed workflow tests
        env:
          CAMPUSOS_DB_USERNAME: campusos_app
          CAMPUSOS_DB_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
          CAMPUSOS_IT_ADMIN_DB_URL: jdbc:postgresql://localhost:5432/campusos?sslmode=disable
          CAMPUSOS_IT_ADMIN_DB_USERNAME: postgres
          CAMPUSOS_IT_ADMIN_DB_PASSWORD: postgres
        run: mvn --batch-mode --no-transfer-progress clean verify
